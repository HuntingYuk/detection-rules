name: rule-gate

# Spec AD1 / Phase-2: the DoD gate runs automatically on every push & PR so the
# ruleset is self-regressing (no silent drift across Suricata updates).

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # No pip cache: idstools+scapy install in ~10s, and actions/cache@v4 itself
      # runs on Node20 (re-introduces the deprecation annotation) — not worth it.
      # No apt/PPA cache: PPA caching is unreliable; ~1min suricata install is fine.

      - name: Install Suricata (latest stable 8.x, OISF PPA)
        run: |
          sudo add-apt-repository -y ppa:oisf/suricata-stable
          sudo apt-get update -qq
          sudo apt-get install -y suricata jq
          suricata -V

      - name: Python deps (idstools parser + scapy PoC synth)
        run: python3 -m pip install --quiet idstools scapy

      - name: Rule gate — lint + validate-meta + PoC/negative for EVERY rule
        working-directory: suricata
        run: python3 scripts/rulectl ci
